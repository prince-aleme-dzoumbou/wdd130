<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting</title>

    <meta name="description"
      content="Contact White Water Rafting to ask questions, make reservations, or share suggestions about our rafting services.">

    <meta name="author" content="Prince Aleme Dzoumbou">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>

        <img src="images/z-splash.png" alt="White Water Rafting company logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>

            </ul>
        </nav>

    </header>

    <main>

        <section class="contact-intro">
            <h1>White Water Rafting Company</h1>

            <address>
                123 Main River Street <br>
                Kolob, California <br>
                <a href="tel:+19999999999">+1 999 999 9999</a><br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>

        </section>

        <section class="content">
            <div class="map">

                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d8888.495746581531!2d-113.15825449078055!3d37.42415479637084!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80ca91afad231a8f%3A0xec6734a36c88eb1f!2sCanyons%20de%20Kolob!5e0!3m2!1sfr!2scg!4v1790947151914!5m2!1sfr!2scg"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>

            </div>

            <form>
                <label for="name">Name: </label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>

                <label for="email">Email: </label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>


                <fieldset>
                    <legend>Message Purpose</legend>

                    <label for="general">
                        <input type="radio" id="general" name="inquiry_type" value="general">
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="inquiry_type"
                          value="reservation">
                        Reservation Question
                    </label>


                    <label for="website">
                        <input type="radio" id="website" name="inquiry_type" value="website">
                        Website Suggestion
                    </label>
                </fieldset>


                <label for="message">Message</label>
                <textarea name="message" id="message" placeholder="Type here"></textarea>

                <label for="subscribe">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/profil.jpg" alt="john smith lead rafting guide image profil">
                <figcaption>
                    John Smith - Lead Rafting Guide
                </figcaption>
            </figure>

            <figure>
                <img src="images/profil.jpg" alt="jan smith, manager profil">
                <figcaption>
                    Jan Smith - Manager
                </figcaption>
            </figure>

            <figure>
                <img src="images/profil.jpg" alt="jos smith, customer service profil">
                <figcaption>
                    Jos smith - Customer service
                </figcaption>
            </figure>
        </section>

    </main>


    <footer>

        <p>©2026 | White Water Rafting | Prince Aleme Dzoumbou</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-svgrepo-com.svg" alt="Facebook Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin-svgrepo-com.svg" alt="LinkedIn Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram-svgrepo-com.svg" alt="Instagram Icon">
            </a>
        </nav>

    </footer>

</body>

</html>
