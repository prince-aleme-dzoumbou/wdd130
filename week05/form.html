<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form for contact</title>
    <link rel="stylesheet" href="styles/form.css">
</head>

<body>

    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>

    <form>

        <fieldset>
            <legend>Contact information</legend>
            <div class="form-item column2">
                <label for="fullname">Fullname: </label>
                <input type="text" id="fullname" name="fullname">
            </div>

            <div class="form-item column2">
                <label for="email">Email: </label>
                <input type="email" id="email" name="email">
            </div>
        </fieldset>

        <fieldset>
            <legend>Questions</legend>

            <div class="form-item column1">
                <label for="browser">What is your favorite internet browser:</label>
                <select name="browser" id="browser">
                    <option value="chrome">Chrome</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>

                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
            </div>

            <label for="feedback">List the places you have lived:</label>
            <textarea name="feedback" id="feedback" rows="5"
              placeholder="Point-Noir , Brazzaville , Paris"></textarea>
            <button type="submit">Submit Poll</button>
        </fieldset>


    </form>

    <footer>
        <p>©2026| HTML Form - User Poll Activity |Prince Aleme Dzoumbou|</p>
    </footer>

</body>

</html>
